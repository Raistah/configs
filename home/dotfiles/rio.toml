use-fork = false
confirm-before-quit = false

env-vars = ["TERM=xterm-256color"]

[shell]
program = "fish"
args = ["--login"]

[navigation]
mode = "Tab"
clickable = false
hide-if-single = true
use-current-path = true
color-automation = []

[fonts]
size = 18
features = []
use-drawable-chars = true
symbol-map = []
disable-warnings-not-found = false
additional-dirs = []

[fonts.regular]
family = "CaskaydiaCove Nerd Font"
style = "Normal"
width = "Normal"
weight = 400

[fonts.bold]
family = "CaskaydiaCove Nerd Font"
style = "Normal"
width = "Normal"
weight = 800

[fonts.italic]
family = "CaskaydiaCove Nerd Font"
style = "Italic"
width = "Normal"
weight = 400

[fonts.bold-italic]
family = "CaskaydiaCove Nerd Font"
style = "Italic"
width = "Normal"
weight = 800

[colors]
background = '#282828'
foreground = '#ebdbb2'
selection-background = '#665c54'
selection-foreground = '#ebdbb2'
cursor = '#ebdbb2'
black = '#282828'
red = '#cc241d'
green = '#98971a'
yellow = '#d79921'
blue = '#458588'
magenta = '#b16286'
cyan = '#689d6a'
white = '#a89984'
light_black = '#928374'
light_red = '#fb4934'
light_green = '#b8bb26'
light_yellow = '#fabd2f'
light_blue = '#83a598'
light_magenta = '#d3869b'
light_cyan = '#8ec07c'
light_white = '#ebdbb2'


[bindings]
keys = [
    { key = "space", with = "control | shift", action = "ToggleVIMode" },
    { key = "]", with = "shift | control", action = "SelectNextSplitOrTab" },
    { key = "[", with = "shift | control", action = "SelectPrevSplitOrTab" }
]

[renderer]
backend = "Vulkan"
